name: Aegis CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-checks:
    name: Lint and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: |
          cd apps/api
          npx prisma generate

      - name: Run Backend Linter
        run: |
          cd apps/api
          npm run lint

      - name: Run Backend Unit Tests
        run: |
          cd apps/api
          npm run test
name: Aegis CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-checks:
    name: Lint and Test Backend
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Security Audit (OWASP A03)
        run: npm audit --audit-level=critical

      - name: Generate Prisma Client
        run: |
          cd apps/api
          npx prisma generate

      - name: Run Backend Linter
        run: |
          cd apps/api
          npm run lint

      - name: Run Backend Unit Tests
        run: |
          cd apps/api
          npm run test
      
      - name: Run E2E Tests
        run: npm run test:e2e
        working-directory: ./apps/api
        env:
          DATABASE_URL: "file:./dev.db"
          DEVICE_INGEST_TOKEN: "aegis-secure-token-2026!"
          JWT_SECRET: "ci-test-secret-key